[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pytauargus-tui"
version = "0.1.0"
description = "Textual terminal UI for Tau-Argus — a thin view over the pytauargus engine"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "EUPL-1.2" }
keywords = ["statistical disclosure control", "SDC", "TUI", "textual", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Programming Language :: Python :: 3",
]
dependencies = [
    "pytauargus>=0.3.0",
    "textual>=0.50",
]

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio"]

[project.urls]
Homepage = "https://github.com/trygu/tauargus-engine"
Repository = "https://github.com/trygu/tauargus-engine"
Issues = "https://github.com/trygu/tauargus-engine/issues"

[project.scripts]
tauargus-tui = "pytauargus_tui.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pytauargus_tui"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
